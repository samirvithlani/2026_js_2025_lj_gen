<!DOCTYPE html>
<html>
<head>
    <script src="./scrolltask.js"></script>
  <style>
    .box {
      width: 300px;
      height: 200px;
      background-color: lightblue;

      position: fixed;
      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);
    }

    .content {
      height: 2000px;
    }
  </style>
</head>

<body>

  <div class="content">
    <h1>Scroll the page</h1>
  </div>

  <div class="box">
    <h2>I'm always in center</h2>
  </div>

</body>
</html>
