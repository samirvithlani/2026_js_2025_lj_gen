<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./formDemo1.js"></script>
</head>
<body>

    <!-- //WHEN YOU NEED TO CALL JS FUNCTION ACTION WILL NOT HELP -->
    <!-- <form action="https://www.google.com"> -->
        <!-- when you press submit button it will defaulty call action attribute
        and when it calls action atrribute it will reaload the page -->

        <!-- <button onclick="test(event)">TEST</button> -->

        <form onsubmit="submitHandler(event)">
        <div>
            <label>NAME</label>
            <input type="text" id="name">
            <span id="namevalue"></span>
        </div>
        <div>
            <label>EMAIL</label>
            <input type="email" id="email">
        </div>
        <div>
            <label>AGE</label>
            <input type="number" id="age" placeholder="enter age">
        </div>
        <div>
            <label>COUNTRY</label> 
            <select id="country">
                <option value="india">INDIA</option>
                <option value="china">CHINA</option>
                <option value="russia">RUSSIA</option>
            </select>
        </div>

        <div>
            <label>GENDER</label> <br>
            MALE : <input type="radio" value="male" name="gender">
            FEMALE : <input type="radio" value="female" name="gender">
        </div>

        <input type="submit">
    </form>
    
</body>
</html>
